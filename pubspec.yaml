name: verdant_ai_0_0_1_alpha
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_generative_ai: ^0.4.6
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^8.1.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

# Placed correctly at the root level of the YAML file
flutter_launcher_icons:
  image_path: "assets/images/appicon.png"
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/seedindex.png
    - assets/images/mycrops.png
    - assets/images/journal.png
    - assets/images/beds.png
    - assets/images/growbotai.png
    - assets/images/community.png